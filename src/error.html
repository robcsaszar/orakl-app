<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.error.message%</title>
    <style>
      body {
        background: #141717;
        color: #e0e8ea;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 0 1rem;
        text-align: center;
        gap: 0.75rem;
      }
      h1 {
        font-size: 1rem;
        font-weight: 600;
        opacity: 0.6;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 28rem;
      }
      button {
        color: inherit;
        background: none;
        font: inherit;
        border: 1px solid #e0e8ea;
        border-radius: 999px;
        padding: 0.5rem 1.25rem;
        margin-top: 0.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Shown when the root layout cannot load (the API is unreachable): no
         app code runs here, so the retry is a form that re-requests this page. -->
    <h1>%sveltekit.status%</h1>
    <p>%sveltekit.error.message%</p>
    <form method="get"><button type="submit">Try again</button></form>
  </body>
</html>
