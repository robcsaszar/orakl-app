packages:
  - "."
  - "packages/*"

nodeLinker: hoisted
autoInstallPeers: true

allowBuilds:
  '@sentry/cli': true
  esbuild: true

overrides:
  'cookie': '0.7.0'
  'acorn': '8.16.0'
  'esbuild@>=0.27.3 <0.28.1': '0.28.1'
  'undici@>=7.0.0 <7.29.0': '7.29.0'
  'postcss@>=8.0.0 <8.5.23': '8.5.23'
  'yaml@>=2.0.0 <2.8.3': '2.8.3'
  'hyperid>uuid': '^11.1.1'
  'xcode>uuid': '^11.1.1'
  'tar@<=7.5.20': '7.5.21'
  'brace-expansion@>=2.0.0 <2.1.4': '2.1.4'
  'brace-expansion@>=3.0.0 <5.0.9': '5.0.9'
  'nanoid@<3.3.18': '3.3.18'
minimumReleaseAgeExclude:
  - '@orakl/protocol@0.1.0 || 0.1.1'
  - '@orakl/shared@0.1.0'
