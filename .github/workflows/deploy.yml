name: Deploy

# Deploys the web app to the `orakl` Fly app on every push to main (a merged
# sync PR). FLY_API_TOKEN is a deploy token scoped to that app alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy orakl
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: >
          flyctl deploy --remote-only --config fly.toml
          --build-arg VITE_SENTRY_DSN="$VITE_SENTRY_DSN"
